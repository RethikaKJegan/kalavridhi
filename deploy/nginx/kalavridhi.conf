# Install inside the Nginx http context (for example sites-available).
# Replace the example hostnames and certificate paths with verified values.
limit_req_zone $binary_remote_addr zone=kalavridhi_admin:10m rate=5r/m;

server {
    listen 80;
    listen [::]:80;
    server_name kalavridhi-arts.com www.kalavridhi-arts.com;
    return 301 https://kalavridhi-arts.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.kalavridhi-arts.com;
    ssl_certificate /etc/letsencrypt/live/kalavridhi-arts.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kalavridhi-arts.com/privkey.pem;
    return 301 https://kalavridhi-arts.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name kalavridhi-arts.com;

    ssl_certificate /etc/letsencrypt/live/kalavridhi-arts.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kalavridhi-arts.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 12M;
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location ^~ /_next/static/ {
        alias /var/www/kalavridhi/.next/static/;
        expires 1y;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location ^~ /images/uploads/ {
        alias /var/www/kalavridhi/public/images/uploads/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location = /api/admin/auth/login {
        limit_req zone=kalavridhi_admin burst=3 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
